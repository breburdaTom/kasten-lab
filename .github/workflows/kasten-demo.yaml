name: Kasten K10 Backup/Restore Demo

on:
  workflow_dispatch:
    inputs:
      k10_version:
        description: 'Kasten K10 Helm chart version (leave empty for latest)'
        required: false
        default: ''
      cleanup_on_failure:
        description: 'Cleanup cluster on failure'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

env:
  KIND_VERSION: "v0.23.0"
  KUBECTL_VERSION: "v1.30.0"
  HELM_VERSION: "v3.15.0"
  K10_NAMESPACE: "kasten-io"
  APP_NAMESPACE: "test-app"
  KASTEN_READY_TIMEOUT: "600"
  BACKUP_TIMEOUT: "600"
  RESTORE_TIMEOUT: "300"

jobs:
  kasten-demo:
    name: "🚀 Kasten K10 Backup/Restore Demo"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # =========================================================================
      # Setup Tools
      # =========================================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/${{ env.KIND_VERSION }}/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/${{ env.KUBECTL_VERSION }}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Install Helm
        run: |
          curl -fsSL https://get.helm.sh/helm-${{ env.HELM_VERSION }}-linux-amd64.tar.gz | tar xz
          sudo mv linux-amd64/helm /usr/local/bin/helm
          helm version

      - name: Install test dependencies
        run: pip install -r requirements.txt

      # =========================================================================
      # Stage 1: Setup Kind Cluster
      # =========================================================================
      - name: "🏗️ Create Kind cluster"
        run: |
          chmod +x scripts/setup/install-kind.sh
          ./scripts/setup/install-kind.sh

      - name: "💾 Install CSI Hostpath Driver"
        run: |
          chmod +x scripts/setup/install-csi-driver.sh
          ./scripts/setup/install-csi-driver.sh

      - name: "📸 Install Snapshot Controller"
        run: |
          chmod +x scripts/setup/install-snapshot-controller.sh
          ./scripts/setup/install-snapshot-controller.sh

      - name: Verify cluster setup
        run: |
          echo "=== Nodes ==="
          kubectl get nodes
          echo "=== All Pods ==="
          kubectl get pods -A
          echo "=== Storage Classes ==="
          kubectl get storageclass
          echo "=== Volume Snapshot Classes ==="
          kubectl get volumesnapshotclass

      # =========================================================================
      # Stage 2: Install Kasten K10
      # =========================================================================
      - name: "📦 Install Kasten K10"
        run: |
          echo "=== Preflight: verify prerequisites before installing Kasten ==="
          echo "StorageClasses:" && kubectl get storageclass || true
          echo "VolumeSnapshotClasses:" && kubectl get volumesnapshotclass || true
          echo "Snapshot Controller:" && kubectl -n kube-system get deploy snapshot-controller || true

          # Fail fast if critical prerequisites are missing
          if ! kubectl get storageclass csi-hostpath-sc >/dev/null 2>&1; then
            echo "ERROR: Required StorageClass 'csi-hostpath-sc' not found. Ensure CSI driver is installed." >&2
            exit 1
          fi
          if ! kubectl get volumesnapshotclass csi-hostpath-snapclass >/dev/null 2>&1; then
            echo "ERROR: Required VolumeSnapshotClass 'csi-hostpath-snapclass' not found. Ensure CSI driver manifests applied." >&2
            exit 1
          fi
          if ! kubectl -n kube-system get deploy snapshot-controller >/dev/null 2>&1; then
            echo "ERROR: Snapshot Controller deployment not found in kube-system. Run snapshot-controller install." >&2
            exit 1
          fi

          chmod +x scripts/setup/install-kasten.sh
          ./scripts/setup/install-kasten.sh
        env:
          K10_VERSION: ${{ github.event.inputs.k10_version }}

      - name: Run cluster and Kasten health tests
        run: |
          pytest tests/test_01_cluster_health.py tests/test_02_kasten_health.py -v --tb=short

      # =========================================================================
      # Stage 3: Deploy Test Application
      # =========================================================================
      - name: "🐘 Deploy PostgreSQL"
        run: |
          chmod +x scripts/deploy/deploy-postgres.sh
          ./scripts/deploy/deploy-postgres.sh

      - name: "🌱 Seed test data"
        run: |
          chmod +x scripts/deploy/seed-data.sh
          ./scripts/deploy/seed-data.sh

      - name: Run application deployment tests
        run: |
          pytest tests/test_03_app_deployment.py -v --tb=short

      # =========================================================================
      # Stage 4: Create Backup
      # =========================================================================
      - name: "📋 Create backup policy"
        run: |
          chmod +x scripts/backup/create-policy.sh
          ./scripts/backup/create-policy.sh

      - name: "💾 Trigger backup"
        run: |
          chmod +x scripts/backup/trigger-backup.sh
          ./scripts/backup/trigger-backup.sh

      - name: Run backup verification tests
        run: |
          pytest tests/test_04_backup_verification.py -v --tb=short

      - name: Save restore point name
        id: restore-point
        run: |
          RESTORE_POINT=$(kubectl get restorepoints -n ${{ env.APP_NAMESPACE }} --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[-1].metadata.name}')
          echo "name=${RESTORE_POINT}" >> $GITHUB_OUTPUT
          echo "Restore point: ${RESTORE_POINT}"

      # =========================================================================
      # Stage 5: Destroy Application (Simulate Disaster)
      # =========================================================================
      - name: "💥 Destroy application"
        run: |
          chmod +x scripts/restore/destroy-app.sh
          ./scripts/restore/destroy-app.sh

      - name: Verify application destroyed
        run: |
          echo "Verifying StatefulSet is deleted..."
          if kubectl get statefulset pg-database -n ${{ env.APP_NAMESPACE }} 2>/dev/null; then
            echo "ERROR: StatefulSet still exists!"
            exit 1
          fi
          echo "✅ StatefulSet successfully deleted"
          
          echo "Verifying PVCs are deleted..."
          PVC_COUNT=$(kubectl get pvc -n ${{ env.APP_NAMESPACE }} --no-headers 2>/dev/null | wc -l)
          if [ "$PVC_COUNT" -gt 0 ]; then
            echo "ERROR: PVCs still exist!"
            exit 1
          fi
          echo "✅ PVCs successfully deleted"

      # =========================================================================
      # Stage 6: Restore Application
      # =========================================================================
      - name: "🔄 Restore application"
        run: |
          chmod +x scripts/restore/restore-app.sh
          ./scripts/restore/restore-app.sh "${{ steps.restore-point.outputs.name }}"

      # =========================================================================
      # Stage 7: Verify Restore & Data Integrity
      # =========================================================================
      - name: "✅ Run restore verification tests"
        run: |
          pytest tests/test_05_restore_verification.py -v --tb=short --html=reports/restore_test_report.html

      - name: "🎉 Print success message"
        run: |
          echo "=============================================="
          echo "🎉 KASTEN K10 DEMO COMPLETED SUCCESSFULLY! 🎉"
          echo "=============================================="
          echo ""
          echo "Summary:"
          echo "  ✅ Kind cluster created"
          echo "  ✅ CSI driver installed"
          echo "  ✅ Kasten K10 installed"
          echo "  ✅ PostgreSQL deployed"
          echo "  ✅ Test data seeded"
          echo "  ✅ Backup created"
          echo "  ✅ Application destroyed"
          echo "  ✅ Application restored"
          echo "  ✅ Data integrity verified"
          echo ""
          echo "=============================================="

      # =========================================================================
      # Upload Artifacts & Cleanup
      # =========================================================================
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: reports/
          retention-days: 30

      - name: "🧹 Cleanup Kind cluster"
        if: always()
        run: |
          if kind get clusters 2>/dev/null | grep -q kasten-demo; then
            echo "Deleting Kind cluster..."
            kind delete cluster --name kasten-demo
            echo "Cluster deleted successfully"
          else
            echo "No cluster to delete"
          fi
