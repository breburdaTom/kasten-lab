# VolumeSnapshotClass for Kasten K10
# This enables Kasten to create volume snapshots using the CSI hostpath driver
#
# Required annotations:
# - snapshot.storage.kubernetes.io/is-default-class: "true" - Makes this the default snapshot class
# - k10.kasten.io/is-snapshot-class: "true" - Marks this as the snapshot class for Kasten
#
# Required labels:
# - k10.kasten.io/isCloneClass: "true" - Enables clone operations for restore
---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: csi-hostpath-snapclass
  annotations:
    # Required: Mark as default VolumeSnapshotClass for the cluster
    snapshot.storage.kubernetes.io/is-default-class: "true"
    # Required: Mark this as the snapshot class for Kasten K10
    k10.kasten.io/is-snapshot-class: "true"
  labels:
    # Required: Enable clone operations for Kasten restore
    k10.kasten.io/isCloneClass: "true"
driver: hostpath.csi.k8s.io
# CRITICAL: Must be Retain to preserve snapshots after PVC/namespace deletion
# With Delete policy, destroying the app namespace deletes the snapshot data,
# making restore impossible even though RestorePoints still exist
deletionPolicy: Retain
