# Kind cluster configuration for Kasten K10 demo
# This creates a multi-node cluster suitable for testing backup/restore
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kasten-demo
nodes:
  # Control plane node
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    # extraPortMappings removed to avoid port conflicts; use kubectl port-forward as needed
  # Worker nodes for workload distribution
  - role: worker
  - role: worker
# Networking configuration
networking:
  # Use default CNI
  disableDefaultCNI: false
  # Pod subnet
  podSubnet: "10.244.0.0/16"
  # Service subnet
  serviceSubnet: "10.96.0.0/12"
